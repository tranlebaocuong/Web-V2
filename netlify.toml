# ==============================================================================
# TỦ SÁCH ÁO LAM — CẤU HÌNH DEPLOY TRÊN NETLIFY (NETLIFY.TOML)
# ==============================================================================

[build]
  command = "prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--frozen-lockfile"
  # APP_ENV / NODE_ENV hold non-sensitive values (e.g. "production") that naturally
  # appear in compiled Next.js code, so they must not be treated as secrets.
  SECRETS_SCAN_OMIT_KEYS = "APP_ENV,NODE_ENV,PORT"
  # Build cache is never deployed; skip scanning it.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

# Next.js 15 Official Netlify Runtime Plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security Headers áp dụng toàn cầu trên Netlify Edge
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Chặn truy cập trực tiếp các tệp nhạy cảm trên Edge
[[redirects]]
  from = "/.env*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.git*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/404"
  status = 404
  force = true
