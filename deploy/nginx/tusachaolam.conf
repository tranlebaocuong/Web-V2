# ==============================================================================
# CẤU HÌNH NGINX CHO TỦ SÁCH ÁO LAM (UBUNTU 22.04 LTS / DEBIAN 12)
# Đường dẫn cài đặt: /etc/nginx/sites-available/tusachaolam.conf
# ==============================================================================

# Giới hạn tần suất truy cập API tránh brute force
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# 1. Chuyển hướng toàn bộ HTTP (Port 80) sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tusachaolam.vn www.tusachaolam.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS chính (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tusachaolam.vn www.tusachaolam.vn;

    # Chứng chỉ SSL/TLS (Do Certbot Let's Encrypt cấp)
    ssl_certificate /etc/letsencrypt/live/tusachaolam.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tusachaolam.vn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HTTP Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Chặn truy cập các tệp nhạy cảm
    location ~ /\.(env|git|svn|htaccess) {
        deny all;
        return 404;
    }

    location ~ \.(sql|bak|backup|log)$ {
        deny all;
        return 404;
    }

    # Giới hạn kích thước tải lên (Cho ảnh tài sản bài học)
    client_max_body_size 10M;

    # Nén Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting cho endpoint đăng nhập quản trị
    location /api/admin/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limiting cho các API chung
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets Next.js (Cache 1 năm)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mặc định chuyển tiếp toàn bộ tới ứng dụng Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
